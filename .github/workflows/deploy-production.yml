name: Deploy production

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      force_full:
        description: Rebuild API + website, run migrations, reload nginx
        type: boolean
        default: false

concurrency:
  group: smebuze-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH to Hostinger VPS
    runs-on: ubuntu-latest
    environment: smebuze
    timeout-minutes: 40
    steps:
      - name: Require environment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "VPS_HOST set: $([ -n "$VPS_HOST" ] && echo yes || echo NO)"
          echo "VPS_USER set: $([ -n "$VPS_USER" ] && echo yes || echo NO)"
          echo "VPS_SSH_KEY set: $([ -n "$VPS_SSH_KEY" ] && echo yes || echo NO)"
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Environment smebuze needs secrets VPS_HOST, VPS_USER, VPS_SSH_KEY."
            exit 1
          fi

      - name: Show what GitHub is shipping
        run: |
          echo "event=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"
          echo "ref=${{ github.ref }}"
          echo "force_full=${{ github.event.inputs.force_full || 'false' }}"

      - name: SSH and run deploy.sh
        env:
          HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER || vars.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          FORCE_FULL: ${{ github.event.inputs.force_full || '0' }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          HOST="$(printf '%s' "$HOST" | tr -d '\r' | xargs)"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '\r' | xargs)"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          python3 - << 'PY'
          import os
          key = os.environ["KEY"].replace("\r", "").strip() + "\n"
          open(os.path.expanduser("~/.ssh/deploy_key"), "w").write(key)
          PY
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null; then
            echo "::error::VPS_SSH_KEY is not a valid private key."
            exit 1
          fi
          echo "ssh user='${SSH_USER}' user_len=${#SSH_USER}"
          echo "GitHub key fingerprint (must match: ssh-keygen -lf ~/.ssh/smebuze_github_actions.pub on your Mac):"
          ssh-keygen -lf ~/.ssh/deploy_key
          if [ "$FORCE_FULL" = "true" ]; then FORCE_FULL=1; fi
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            "${SSH_USER}@${HOST}" bash -s << EOF
          set -euo pipefail
          export APP_DIR=/var/www/smebuze
          export DEPLOY_BRANCH=production
          export FORCE_FULL='$FORCE_FULL'
          echo "[github] sha=$GIT_SHA force_full=\$FORCE_FULL user=\$(id -un)"
          if [ ! -f /var/www/smebuze/scripts/deploy.sh ]; then
            echo "Clone production to /var/www/smebuze first."
            exit 1
          fi
          if [ "\$(id -un)" = "root" ] && id smebuze >/dev/null 2>&1; then
            echo "[github] running deploy as user smebuze"
            sudo -u smebuze -H env APP_DIR=/var/www/smebuze DEPLOY_BRANCH=production FORCE_FULL=\$FORCE_FULL \
              bash /var/www/smebuze/scripts/deploy.sh
          else
            bash /var/www/smebuze/scripts/deploy.sh
          fi
          EOF
