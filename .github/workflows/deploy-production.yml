name: Deploy production

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      force_full:
        description: Rebuild API + website, run migrations, reload nginx
        type: boolean
        default: false

concurrency:
  group: smebuze-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH to Hostinger VPS
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Show what GitHub is shipping
        run: |
          echo "event=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"
          echo "ref=${{ github.ref }}"
          echo "force_full=${{ github.event.inputs.force_full || 'false' }}"

      - name: Run scripts/deploy.sh on the VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            export APP_DIR=/var/www/smebuze
            export DEPLOY_BRANCH=production
            export FORCE_FULL="${{ github.event.inputs.force_full || '0' }}"
            if [ "$FORCE_FULL" = "true" ]; then export FORCE_FULL=1; fi
            echo "[github] sha=${{ github.sha }} force_full=$FORCE_FULL"
            if [ ! -f "$APP_DIR/scripts/deploy.sh" ]; then
              echo "Clone production to $APP_DIR first."
              exit 1
            fi
            bash "$APP_DIR/scripts/deploy.sh"
