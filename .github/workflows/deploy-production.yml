name: Deploy production

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      force_full:
        description: Rebuild API + website, run migrations, reload nginx
        type: boolean
        default: false

concurrency:
  group: smebuze-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH to Hostinger VPS
    runs-on: ubuntu-latest
    environment: smebuze
    timeout-minutes: 40
    steps:
      - name: Require repository secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "VPS_HOST set: $([ -n "$VPS_HOST" ] && echo yes || echo NO)"
          echo "VPS_USER set: $([ -n "$VPS_USER" ] && echo yes || echo NO)"
          echo "VPS_SSH_KEY set: $([ -n "$VPS_SSH_KEY" ] && echo yes || echo NO)"
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::GitHub environment 'smebuze' has no VPS_HOST / VPS_USER / VPS_SSH_KEY."
            echo "Open: https://github.com/deepj2013/smebuze/settings/environments"
            echo "Click environment smebuze → Environment secrets → Add secret."
            echo "Names: VPS_HOST, VPS_USER, VPS_SSH_KEY (all caps)."
            exit 1
          fi

      - name: Show what GitHub is shipping
        run: |
          echo "event=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"
          echo "ref=${{ github.ref }}"
          echo "force_full=${{ github.event.inputs.force_full || 'false' }}"

      - name: Run scripts/deploy.sh on the VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -euo pipefail
            export APP_DIR=/var/www/smebuze
            export DEPLOY_BRANCH=production
            export FORCE_FULL="${{ github.event.inputs.force_full || '0' }}"
            if [ "$FORCE_FULL" = "true" ]; then export FORCE_FULL=1; fi
            echo "[github] sha=${{ github.sha }} force_full=$FORCE_FULL"
            if [ ! -f "$APP_DIR/scripts/deploy.sh" ]; then
              echo "Clone production to $APP_DIR first."
              exit 1
            fi
            if [ "$(id -un)" = "root" ] && id smebuze >/dev/null 2>&1; then
              echo "[github] running deploy as user smebuze"
              sudo -u smebuze -H env APP_DIR="$APP_DIR" DEPLOY_BRANCH="$DEPLOY_BRANCH" FORCE_FULL="$FORCE_FULL" \
                bash "$APP_DIR/scripts/deploy.sh"
            else
              bash "$APP_DIR/scripts/deploy.sh"
            fi
