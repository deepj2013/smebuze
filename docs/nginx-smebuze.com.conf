# Nginx — https://smebuze.com and https://www.smebuze.com  (Next.js on port 3001)
# Copy:
#   sudo cp docs/nginx-smebuze.com.conf /etc/nginx/sites-available/smebuze.com
#   sudo ln -sf /etc/nginx/sites-available/smebuze.com /etc/nginx/sites-enabled/smebuze.com
#   sudo nginx -t && sudo systemctl reload nginx
# Do not use default_server here — other apps on this VPS have their own server_name.

server {
    listen 80;
    listen [::]:80;
    server_name smebuze.com www.smebuze.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
